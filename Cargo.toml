[package]
name = "romposer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1.13.1"
fancy-regex = "0.20.0"
md5 = "0.8.1"
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.13.5", features = ["http2", "stream"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
libc = "0.2"
zip = { version = "9.4.1", default-features = false, features = ["deflate", "bzip2", "time"] }

[dev-dependencies]
